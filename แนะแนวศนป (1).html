<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แนะแนวโรงเรียนศาสนูปถัมภ์ปากพะยูน มูลนิธิ</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#1E3A8A;--accent:#1E3A8A;--bg:#F0F9FF;--soft:#FFF1F7;--mid:#DBEAFE;--ink:#1f2a44}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Prompt','Noto Sans Thai',system-ui,sans-serif;color:var(--ink)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;flex:none;transform-origin:center center}
.slide{position:absolute;inset:0;background:#fff;border-radius:36px;box-shadow:0 10px 40px rgba(30,58,138,.12),0 2px 8px rgba(30,58,138,.08);padding:48px 64px 56px;display:none;flex-direction:column}
.slide.active{display:flex}
.tag{position:absolute;top:26px;left:34px;background:var(--mid);color:var(--primary);font-weight:700;font-size:16px;padding:6px 18px;border-radius:999px}
.num{position:absolute;bottom:20px;right:34px;font-size:16px;font-weight:500;color:var(--primary);opacity:.7}
h1,h2{font-weight:800;color:var(--primary);line-height:1.25}
h2{font-size:46px;margin-top:30px}
em{font-style:normal;background:linear-gradient(90deg,#1E3A8A,#3B82F6);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:22px;color:#475577;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:auto;margin-bottom:auto;padding-top:14px}
.card{border-radius:26px;padding:28px 26px;display:flex;flex-direction:column;gap:12px;min-height:310px;opacity:0}
.card.dark{background:var(--primary);color:#fff}
.card.mid{background:var(--mid);color:var(--primary)}
.card.soft{background:var(--soft);color:var(--primary)}
.grid.c4{grid-template-columns:1fr 1fr;gap:20px}
.grid.c4 .card{flex-direction:row;align-items:center;min-height:0;gap:22px;padding:18px 26px}
.grid.c4 .ic{flex:none}
.grid.c4 .card p{font-size:19px;line-height:1.5}
.grid.c4 .card h3{font-size:25px;margin-bottom:4px}
.slide.active .card:nth-child(4){animation-delay:.9s}
.card h3{font-size:27px;font-weight:700;line-height:1.3}
.card p{font-size:21px;line-height:1.55;font-weight:400}
.ic{width:72px;height:72px;border-radius:50%;background:var(--primary);display:grid;place-items:center;transition:transform .25s}
.card.dark .ic{background:#fff}
.card.dark .ic svg{stroke:var(--primary)}
.ic svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic:hover{transform:scale(1.12)}
.slide.active .card{animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
.slide.active .card:nth-child(1){animation-delay:.15s}
.slide.active .card:nth-child(2){animation-delay:.4s}
.slide.active .card:nth-child(3){animation-delay:.65s}
.slide.active .head{animation:up .6s ease both}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.head{display:flex;justify-content:space-between;align-items:flex-start}
.head .ic{width:96px;height:96px;margin-top:30px}
.head .ic svg{width:52px;height:52px}
/* cover */
.cover{justify-content:center;align-items:flex-start}
.cover .ic{width:120px;height:120px;margin-bottom:26px}
.cover .ic svg{width:66px;height:66px}
.cover h1{font-size:68px}
.cover .by{margin-top:26px;font-size:26px;color:#475577}
.cover .chips{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
.chip{background:var(--soft);color:var(--primary);font-weight:700;font-size:22px;padding:10px 24px;border-radius:999px}
.chip.d{background:var(--primary);color:#fff}
.blob{position:absolute;right:-60px;bottom:-60px;width:380px;height:380px;border-radius:50%;background:var(--soft);z-index:0}
.blob2{position:absolute;right:90px;top:-70px;width:200px;height:200px;border-radius:50%;background:var(--mid);z-index:0}
.cover>*{position:relative;z-index:1}
#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:9}
#nav button{width:44px;height:44px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 3px 10px rgba(30,58,138,.3)}
#nav button:hover{filter:brightness(1.2)}
</style>
</head>

const stage=document.getElementById('stage');
slides.forEach((s,i)=>{
 const d=document.createElement('section');d.className='slide'+(s.cover?' cover':'');
 if(s.cover){
  d.innerHTML=`<div class="blob"></div><div class="blob2"></div>${ic('school')}
  <h1>แนะแนว<br><em>โรงเรียนศาสนูปถัมภ์ปากพะยูน มูลนิธิ</em></h1>
  <div class="by">นำเสนอโดย ฝ่ายวิเทศสัมพันธ์ โรงเรียนศาสนูปถัมภ์ปากพะยูน มูลนิธิ</div>
  <div class="chips"><span class="chip d">รับสมัครนักเรียนใหม่ ปีการศึกษา 2570</span><span class="chip">โรงเรียนรางวัลพระราชทาน 2 สมัย</span></div>`;
 } else {
  d.innerHTML=`<div class="tag">${s.tag}</div>
  <div class="head"><div><h2>${s.title}</h2><div class="sub">${s.sub}</div></div>${ic(s.icon)}</div>
  <div class="grid c${s.cards.length}">${s.cards.map(c=>`<div class="card ${c[3]}">${ic(c[0])}<div><h3>${c[1]}</h3><p>${c[2]}</p></div></div>`).join('')}</div>`;
 }
 d.insertAdjacentHTML('beforeend',`<div class="num">${i+1} / ${slides.length}</div>`);
 stage.appendChild(d);
});
const els=[...document.querySelectorAll('.slide')];
let cur=0;
function show(n){cur=Math.max(0,Math.min(els.length-1,n));els.forEach((e,i)=>e.classList.toggle('active',i===cur));location.hash=cur+1}
function fit(){const s=Math.min(innerWidth/1320,(innerHeight-60)/760);stage.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key))show(cur+1);if(['ArrowLeft','PageUp'].includes(e.key))show(cur-1)});
let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX);
addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1));x0=null});
show((parseInt(location.hash.slice(1))||1)-1);
</script>
</body>
</html>
